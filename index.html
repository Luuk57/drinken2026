<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MijnData Tracker</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f6f9; margin: 0; padding: 16px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h1 { font-size: 1.5rem; color: #1e3a8a; text-align: center; margin-top: 0; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #e2e8f0; border-radius: 8px; font-weight: bold; cursor: pointer; color: #475569; }
        .tab-btn.active { background: #2563eb; color: white; }
        
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.9rem; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        
        button.submit-btn { width: 100%; background: #16a34a; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #status { text-align: center; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 MijnData Invoering</h1>

    <!-- Tabbladen voor verschillende formulieren -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('drinken')">💧 Drinken</button>
        <button class="tab-btn" onclick="switchTab('eten')">🍽️ Eten</button>
        <button class="tab-btn" onclick="switchTab('ritten')">🚗 Ritten</button>
    </div>

    <!-- Formulier Drinken -->
    <form id="form-drinken" onsubmit="verstuurData(event, 'drinken')">
        <div class="form-group">
            <label>Type drank:</label>
            <input type="text" id="drinken-type" placeholder="bijv. Water, Koffie, Thee" required>
        </div>
        <div class="form-group">
            <label>Hoeveelheid (ml):</label>
            <input type="number" id="drinken-ml" placeholder="250" required>
        </div>
        <button type="submit" class="submit-btn">Verstuur naar Tabblad 'Drinken'</button>
    </form>

    <!-- Formulier Eten -->
    <form id="form-eten" style="display:none;" onsubmit="verstuurData(event, 'eten')">
        <div class="form-group">
            <label>Omschrijving maaltijd:</label>
            <input type="text" id="eten-omschrijving" placeholder="bijv. Broodje kaas" required>
        </div>
        <div class="form-group">
            <label>Calorieën (optioneel):</label>
            <input type="number" id="eten-calorieen" placeholder="350">
        </div>
        <button type="submit" class="submit-btn">Verstuur naar Tabblad 'Eten'</button>
    </form>

    <!-- Formulier Ritten -->
    <form id="form-ritten" style="display:none;" onsubmit="verstuurData(event, 'ritten')">
        <div class="form-group">
            <label>Van:</label>
            <input type="text" id="ritten-van" placeholder="Vertreklocatie" required>
        </div>
        <div class="form-group">
            <label>Naar:</label>
            <input type="text" id="ritten-naar" placeholder="Bestemming" required>
        </div>
        <div class="form-group">
            <label>Kilometers:</label>
            <input type="number" id="ritten-km" placeholder="15" required>
        </div>
        <button type="submit" class="submit-btn">Verstuur naar Tabblad 'Ritten'</button>
    </form>

    <div id="status"></div>
</div>

<script>
    // PLAK HIER JOUW GOOGLE APPS SCRIPT WEB-APP URL IN:
    const SCRIPT_URL = "HIER_JOUW_APPS_SCRIPT_URL_PLAKKEN";

    function switchTab(tabNaam) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        document.getElementById('form-drinken').style.display = tabNaam === 'drinken' ? 'block' : 'none';
        document.getElementById('form-eten').style.display = tabNaam === 'eten' ? 'block' : 'none';
        document.getElementById('form-ritten').style.display = tabNaam === 'ritten' ? 'block' : 'none';
    }

    async function verstuurData(e, actie) {
        e.preventDefault();
        let status = document.getElementById('status');
        status.style.color = '#2563eb';
        status.innerText = "Opslaan in Google Sheet...";

        let payload = { actie: actie };

        if (actie === 'drinken') {
            payload.type = document.getElementById('drinken-type').value;
            payload.ml = document.getElementById('drinken-ml').value;
        } else if (actie === 'eten') {
            payload.omschrijving = document.getElementById('eten-omschrijving').value;
            payload.calorieen = document.getElementById('eten-calorieen').value;
        } else if (actie === 'ritten') {
            payload.van = document.getElementById('ritten-van').value;
            payload.naar = document.getElementById('ritten-naar').value;
            payload.km = document.getElementById('ritten-km').value;
        }

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Voorkomt CORS problemen met Apps Script
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            status.style.color = '#16a34a';
            status.innerText = `Succesvol opgeslagen in tabblad '${actie.charAt(0).toUpperCase() + actie.slice(1)}'! ✅`;
            e.target.reset();
            setTimeout(() => status.innerText = "", 3000);
        } catch (err) {
            console.error(err);
            status.style.color = '#ef4444';
            status.innerText = "Er is een fout opgetreden bij het verzenden.";
        }
    }
</script>

</body>
</html>
